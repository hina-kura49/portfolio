<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>liwin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F4A"/>
      <stop offset="1" stop-color="#11131F"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AA2FF"/>
      <stop offset="1" stop-color="#4F6BFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <!-- focused window glow -->
  <rect x="22" y="24" width="44" height="80" rx="9" fill="#5B7BFF" opacity=".55" filter="url(#glow)"/>
  <!-- focused window -->
  <rect x="22" y="24" width="44" height="80" rx="9" fill="url(#focus)"/>
  <rect x="22" y="24" width="44" height="12" rx="9" fill="#fff" fill-opacity=".18"/>
  <circle cx="30" cy="30" r="2" fill="#fff" fill-opacity=".9"/>
  <circle cx="37" cy="30" r="2" fill="#fff" fill-opacity=".6"/>
  <path d="M31 50h22M31 58h16M31 66h19" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
  <!-- stacked windows -->
  <rect x="72" y="24" width="34" height="37" rx="9" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
  <rect x="72" y="67" width="34" height="37" rx="9" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
  <path d="M80 36h18M80 79h12" stroke="#fff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
</svg>
